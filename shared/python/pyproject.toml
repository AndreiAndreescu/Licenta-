[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webintel-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "redis>=5.0.4",
    "python-json-logger>=2.0.7",
]

[tool.setuptools]
packages = { find = { where = ["."] } }
